name: Barnskoj catalogue integrity
on:
  push:
    paths:
      - 'catalog/**'
      - 'devops/**'
      - 'tags/**'
      - 'profiles/**'
      - 'records/**'
      - 'sources/**'
      - 'evidence/**'
      - 'quality/**'
      - 'images/**'
      - 'rights/**'
      - 'sourcing/**'
      - 'wiki-src/**'
      - 'creative/**'
      - 'production/**'
      - 'discovery/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/catalog-validation.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject stale canonical outputs and compatibility views
        run: python scripts/build_catalog.py --check
      - name: Validate legacy catalogue
        run: python scripts/validate_catalog.py
      - name: Validate universal entity parity and evidence
        run: python scripts/validate_parity.py
      - name: Reject stale generated vector prototypes
        run: python scripts/build_prototypes.py --check
      - name: Validate SVG geometry, labels and solutions
        run: python scripts/validate_svg_prototypes.py
      - name: Validate actual activity and asset release gates
        run: python scripts/validate_production.py
      - name: Fail on stale derived discovery graph
        run: python scripts/build_discovery.py --check
      - name: Run example cross-category queries
        run: |
          python scripts/query_discovery.py --entity BS-CHAR-0001
          python scripts/query_discovery.py --theme music --era 1970s --limit 4
      - name: Validate franchise Wiki sources and image/legal assignments
        run: python scripts/validate_source_model.py
      - name: Check copyright triage derived ledger
        run: python scripts/build_rights.py --check
      - name: Check Wiki source pages and picture indexes
        run: python scripts/build_wiki.py --check
      - name: Verify prospective pre-WP state (BLOCKED is acceptable; do not fake readiness)
        run: python scripts/check_wp_prerequisites.py --check
      - name: Exercise source watcher offline
        run: python scripts/watch_wiki_sources.py --check-fixture
      - name: Run integrity tests
        run: python -m unittest discover -s tests -v
