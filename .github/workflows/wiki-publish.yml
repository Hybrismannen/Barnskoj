name: Publish Barnskoj GitHub Wiki
on:
  push:
    branches: [main]
    paths:
      - 'wiki-src/**'
      - 'scripts/build_wiki.py'
      - '.github/workflows/wiki-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: barnskoj-wiki-publish
  cancel-in-progress: false
jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure generated index pages are current
        run: python scripts/build_wiki.py --check
      - name: Require dedicated Wiki Git credentials
        env:
          WIKI_TOKEN: ${{ secrets.BARNSKOJ_WIKI_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${WIKI_TOKEN}" ]]; then
            echo "::error::BARNSKOJ_WIKI_TOKEN is missing. Supply a token authorized to read and write the repository Wiki Git remote; the default GITHUB_TOKEN must not silently substitute."
            exit 1
          fi
      - name: Push and verify managed Markdown pages
        env:
          WIKI_TOKEN: ${{ secrets.BARNSKOJ_WIKI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          target="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          export GIT_TERMINAL_PROMPT=0
          askpass="$(mktemp)"
          printf '#!/bin/sh\ncase "$1" in *Username*) printf "x-access-token" ;; *Password*) printf "%%s" "$WIKI_TOKEN" ;; esac\n' > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass"
          trap 'rm -f "$askpass"' EXIT
          if ! git ls-remote "$target" HEAD >/dev/null; then
            echo "::error::Unable to authenticate to Wiki Git. Check Wiki initialization and BARNSKOJ_WIKI_TOKEN authorization."
            exit 1
          fi
          git clone --quiet "$target" "$RUNNER_TEMP/barnskoj-wiki"
          for f in wiki-src/*.md; do
            cp "$f" "$RUNNER_TEMP/barnskoj-wiki/$(basename "$f")"
          done
          cd "$RUNNER_TEMP/barnskoj-wiki"
          git config user.name "barnskoj-wiki-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- '*.md'
          if git diff --cached --quiet; then
            echo "Wiki already synchronized."
          else
            git commit -m "Sync Wiki pages from Barnskoj main" >/dev/null
            git push origin HEAD
          fi
          expected="$(git rev-parse HEAD)"
          observed="$(git ls-remote "$target" HEAD | cut -f1)"
          if [[ "$expected" != "$observed" ]]; then
            echo "::error::Wiki remote SHA did not match checked-in content."
            exit 1
          fi
          echo "### Wiki Git remote verification" >> "$GITHUB_STEP_SUMMARY"
          echo "Remote: ${GITHUB_REPOSITORY}.wiki.git" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified commit: ${observed}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source main SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual external attestation remains required in devops/WIKI_PUBLICATION.json." >> "$GITHUB_STEP_SUMMARY"
          echo "Wiki remote Git commit verified: $observed"
